apiVersion: batch/v1
kind: Job
metadata:
  name: note-service-migrator
  labels:
    app.kubernetes.io/name: migrator
    app.kubernetes.io/part-of: note-service
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrator
        app.kubernetes.io/part-of: note-service
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: sre-migrator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: note-service-config
                  key: DATABASE_URL
          resources:
            requests:
              memory: 16Mi
              cpu: 20m
            limits:
              memory: 64Mi
              cpu: 100m

