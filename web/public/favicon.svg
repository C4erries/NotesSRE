  <circle cx="42.5" cy="47" r="1.6" fill="#1E1B4B" />
  <circle cx="58" cy="47" r="3" fill="#FFFFFF" />
  <circle cx="57.5" cy="47" r="1.6" fill="#1E1B4B" />

  <!-- Cheeks & Smile -->
  <ellipse cx="37" cy="53" rx="2.5" ry="1.5" fill="#F87171" opacity="0.8" />
  <ellipse cx="63" cy="53" rx="2.5" ry="1.5" fill="#F87171" opacity="0.8" />
  <path d="M 45 54 Q 50 59 55 54" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" fill="none" />
