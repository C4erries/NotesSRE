    <ellipse cx="50" cy="23" rx="9" ry="21" fill="url(#favPetal)" transform="rotate(210 50 50)" />
    <ellipse cx="50" cy="23" rx="9" ry="21" fill="url(#favPetal)" transform="rotate(240 50 50)" />
    <ellipse cx="50" cy="23" rx="9" ry="21" fill="url(#favPetal)" transform="rotate(270 50 50)" />
