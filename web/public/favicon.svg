    <ellipse cx="50" cy="23" rx="9" ry="21" fill="url(#favPetal)" transform="rotate(30 50 50)" />
    <ellipse cx="50" cy="23" rx="9" ry="21" fill="url(#favPetal)" transform="rotate(60 50 50)" />
    <ellipse cx="50" cy="23" rx="9" ry="21" fill="url(#favPetal)" transform="rotate(90 50 50)" />
