<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="50%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <radialGradient id="favCenter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#92400E" />
      <stop offset="70%" stopColor="#78350F" />
      <stop offset="100%" stopColor="#451A03" />
    </radialGradient>
    <linearGradient id="favLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
  </defs>

  <!-- Green Leaves -->
  <path d="M 18 72 C 8 66 6 82 17 86 C 28 86 28 76 18 72 Z" fill="url(#favLeaf)" />
  <path d="M 82 72 C 92 66 94 82 83 86 C 72 86 72 76 82 72 Z" fill="url(#favLeaf)" />

