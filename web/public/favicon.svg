    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(45 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(75 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(105 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(135 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(165 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(195 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(225 50 50)" />
    <ellipse cx="50" cy="26" rx="6.5" ry="16" fill="#FDE047" transform="rotate(255 50 50)" />
